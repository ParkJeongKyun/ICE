name: Deploy
on:
  push:
    tags:
      - 'v*'
      # 태그를 푸시하는 경우 운영에 배포됨 (GitHub Pages)

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 배포를 끝까지 진행
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies, test and build
        env:
          # 화면에 표시되는 버전은 푸시한 태그 이름 (.env 값보다 우선)
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    # 배포가 끝나면 RELEASE_NOTES.md 내용으로 GitHub Release를 만듦
    # (같은 태그로 다시 배포하면 내용을 갱신)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" \
              --notes-file RELEASE_NOTES.md --verify-tag
          fi
